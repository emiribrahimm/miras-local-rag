[project]
name = "miras-rag"
version = "0.1.0"
description = "Miras: Microsoft Foundry Local ile tamamen cihazda çalışan Türkçe RAG asistanı"
requires-python = ">=3.12"
dependencies = [
    "foundry-local-sdk>=2.1,<3",
    "numpy>=2.5.3",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
